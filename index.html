<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">
    <!-- Logo -->
    <div id="logo">
        <img src="google.jpg" alt="Google! Logo" width="350">
    </div>

    <!-- Search Box -->
    <div id="search">
        <p>Search the web using Google!</p>
        <input type="text" size="45">
        <br>
        <button>Google Search</button>
        <button>I'm feeling lucky</button>
    </div>

    <!-- 3 Boxes -->
    <div id="bottom">
        <div class="box" id="box1">
            <p>Special Searches</p>
            <a href="#">Stanford Search</a><br>
            <a href="#">Linux Search</a>
        </div>

        <div class="box" id="box2">
            <a href="#">Help!</a><br>
            <a href="#">About Google!</a><br>
            <a href="#">Company Info</a><br>
            <a href="#">Google! Logos</a>
        </div>

        <div class="box" id="box3">
            <p>Get Google!<br>updates monthly:</p>
            <input type="text" placeholder="your e-mail"><br>
            <button>Subscribe</button>
            <a href="#">Archive</a>
        </div>
    </div>

    <p id="copyright">Copyright ©1998 Google Inc.</p>
</div>

</body>
</html>
